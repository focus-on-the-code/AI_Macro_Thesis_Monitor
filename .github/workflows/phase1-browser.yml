name: Phase 1 browser QA
on:
  pull_request:
    paths:
      - "app.py"
      - "monitor/**"
      - "pages/**"
      - "scripts/phase1_browser_smoke.py"
      - ".github/workflows/phase1-browser.yml"
      - "requirements.txt"
permissions:
  contents: read
jobs:
  browser:
    name: Streamlit browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Start Streamlit
        run: |
          python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/streamlit.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8501/ > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8501/ > /dev/null
      - name: Run browser smoke checks
        run: python scripts/phase1_browser_smoke.py --base-url http://127.0.0.1:8501
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-browser-evidence
          path: |
            artifacts/phase1-browser/**
            /tmp/streamlit.log
          if-no-files-found: warn
