product:
  name: AI / Macro Thesis Monitor
  version: '0.91'
  date: October 4, 2026
  status: Pre-build PRD - approved concept, ready for implementation
  purpose: Auditable public-data-first AI/macro financial research dashboard; not investment advice.
pages:
- Dashboard
- Evidence
- About
- Definitions & Methodology
principles:
- Show the work
- Primary evidence first
- Contradictions are signal
- Market confirmation belongs with the variable
- Interpretation must be practical
- Free-first, approval-gated cost
- Reproducible by default
- Vintage-aware research
- Repository is shared agent state
agent_coordination:
  default_roles:
    coordinator: ChatGPT Work or equivalent project-coordination agent; owns phase orchestration, research, acceptance
      criteria and owner-facing status.
    implementation_agent: Codex or equivalent repository-level coding agent; owns code changes, tests, commands and debugging.
  shared_state: The GitHub repository and GitHub artifacts are the shared state layer. Agents must not depend on one
    another's private chat history.
  no_user_relay_rule: The owner is not a message bus. Routine prompts, implementation summaries, test results and status
    must not require owner copy/paste between agents.
  required_repo_artifacts:
  - docs/phase-status.md
  - docs/handoffs/current-task.md
  - docs/verification/<phase>-report.md
  - docs/decision_log.md
  - commits/PRs/issues/CI artifacts as applicable
  handoff_protocol:
  - Coordinator writes/updates current-task and phase-status before implementation begins.
  - Implementation agent reads repo-resident requirements/task state and performs the scoped work.
  - Implementation agent commits code/tests and writes verification evidence/status back to repo/GitHub artifacts.
  - Coordinator reviews artifacts against phase exit criteria and either accepts the gate or writes the next fix task.
  - Ask owner only for credentials/permissions, paid-service approval, unresolved product decisions, external-account
    actions, or genuine human-judgment blockers.
panels:
- id: V1
  name: AI Economics & Competition
  question: Is AI intelligence getting cheaper faster than economically useful demand is growing?
  purpose: Test the Eisman-style commoditization / price-war thesis without assuming that lower token prices are automatically
    bearish.
  metrics:
  - name: Comparable AI workload price index
    definition: 'Cost of a fixed workload: 1,000,000 input tokens + 250,000 output tokens for a maintained basket of
      comparable models; each model and basket are also shown separately. Index = current basket cost / base-date basket
      cost x 100.'
  - name: Observed token volume index
    definition: Observed tokens from approved public usage proxies, normalized to 100 at the base date. Always labeled
      as sample/proxy, never market-wide volume.
  - name: Open-weight share
    definition: Open-weight observed tokens / total observed tokens x 100.
  - name: Frontier/proprietary share
    definition: Approved frontier/proprietary observed tokens / total observed tokens x 100.
  - name: Demand elasticity proxy
    definition: '% change in observed token volume / absolute % decline in effective workload price over the same interval.
      Optional and explicitly labeled as a proxy because model mix and workload quality change.'
  tickers:
  - NVDA
  - AMD
  - AVGO
  - GOOGL
  - MSFT
  - AMZN
  - IGV
  sources: Provider price pages, approved public usage proxies (e.g., OpenRouter/Vercel where terms allow), company disclosures,
    Census/Ramp-style enterprise indicators when publicly usable.
  interpretation_requirement: '1-3 sentences: explain whether price pressure is being offset by volume/adoption and whether
    model mix is shifting toward lower-cost/open-weight alternatives. Never conclude that falling token prices alone
    are bearish.'
- id: V2
  name: AI Capital, Credit & Concentration
  question: Are AI infrastructure commitments producing enough cash flow and diversified demand to justify the capital
    and financing burden?
  purpose: Track the financial transmission mechanism that could connect weak AI economics to hyperscaler cash flow,
    corporate credit, infrastructure suppliers and market concentration.
  metrics:
  - name: TTM capex
    definition: Sum of the most recent four quarters of purchases of property/equipment or the company-specific capex
      definition; store raw XBRL tag and reconciliation.
  - name: TTM free cash flow
    definition: TTM operating cash flow - TTM capex. Use the same capex definition consistently and show the components.
  - name: Capex growth
    definition: Current TTM capex / prior-year TTM capex - 1.
  - name: Capex coverage
    definition: TTM operating cash flow / TTM capex.
  - name: FCF margin
    definition: TTM free cash flow / TTM revenue.
  - name: Interest coverage
    definition: TTM EBIT / TTM interest expense where both are comparable; otherwise display N/A with explanation.
  - name: Debt change
    definition: Current total debt - prior-year total debt; separately display disclosed new debt issuance when identifiable.
  - name: Concentration
    definition: Disclosed customer concentration metrics only. If a percentage is only a secondary estimate, mark it
      ESTIMATE and do not blend into a verified company calculation.
  - name: Off-balance-sheet exposure
    definition: Disclosed lease commitments, guarantees, VIE/SPV maximum loss exposure and similar items. Store source
      filing section/page and whether standardized XBRL is available.
  tickers:
  - MSFT
  - GOOGL
  - AMZN
  - META
  - ORCL
  - NVDA
  - AVGO
  - AMD
  sources: SEC EDGAR 10-Q/10-K/8-K, company investor relations, ratings/credit data available from approved public sources,
    manually curated filing disclosures for non-standard items.
  interpretation_requirement: Explain whether capex is accelerating faster than cash generation, whether financing is
    becoming more debt-dependent, and whether customer/off-balance-sheet concentration is increasing. Separate verified
    filings from analyst estimates.
- id: V3
  name: Rates, Credit & Liquidity
  question: Is the cost and availability of capital becoming more restrictive for long-duration equities, AI infrastructure
    and the broader economy?
  purpose: Track Paulsen-related curve behavior while avoiding the mistake of treating curve slope as equivalent to the
    absolute level of rates.
  metrics:
  - name: 2-year Treasury yield
    definition: Official daily 2Y par/constant maturity yield.
  - name: 10-year Treasury yield
    definition: Official daily 10Y par/constant maturity yield.
  - name: 30-year Treasury yield
    definition: Official daily 30Y par/constant maturity yield.
  - name: 2s10s spread
    definition: (10Y yield - 2Y yield) x 100 basis points.
  - name: 10Y real yield
    definition: Official Treasury/FRED real yield series; no synthetic substitution if the official observation is unavailable.
  - name: High-yield OAS
    definition: Approved FRED credit-spread series.
  - name: Investment-grade OAS
    definition: Approved FRED credit-spread series.
  - name: Broad dollar / approved USD index
    definition: Use an approved public series; explicitly distinguish broad Fed dollar index from market DXY if both
      are shown.
  tickers:
  - TLT
  - IEF
  - SHY
  - HYG
  - LQD
  - GLD
  sources: U.S. Treasury, FRED/ALFRED, approved public FX/market-data feed.
  interpretation_requirement: Explain whether financing conditions are loosening or tightening, and distinguish yield-curve
    shape from the absolute discount rate and credit spreads.
- id: V4
  name: Fiscal Position
  question: Is the federal financing burden becoming more difficult, and are Treasury auctions showing weakening or strengthening
    demand?
  purpose: Track sovereign balance-sheet pressure and the ability of markets to absorb Treasury supply without conflating
    a large debt level with an immediate crisis.
  metrics:
  - name: Debt held by the public
    definition: Latest Treasury Fiscal Data debt_held_public_amt.
  - name: Rolling-12-month deficit
    definition: Sum of the most recent 12 months of federal receipts minus outlays using Treasury/BEA-approved series;
      exact source and sign convention documented.
  - name: Rolling-12-month net interest
    definition: Sum of the most recent 12 months of net interest outlays from the approved fiscal source.
  - name: Net interest / receipts
    definition: Rolling-12-month net interest / rolling-12-month federal receipts.
  - name: Debt / GDP
    definition: Debt held by the public / nominal GDP, aligned to the latest comparable quarter; show vintage dates.
  - name: 10Y/30Y auction bid-to-cover
    definition: 'Published bid-to-cover. Also show deviation from trailing 12 comparable auctions: current minus median.'
  - name: Indirect bidder share
    definition: Indirect bidder accepted / total accepted x 100 for comparable auctions, when available.
  tickers:
  - TLT
  - IEF
  - SHY
  - GLD
  sources: Treasury Fiscal Data, TreasuryDirect auction query, BEA/FRED for GDP, CBO only as an external forecast/context
    source rather than an observed-data feed.
  interpretation_requirement: Explain whether debt-service costs and auction absorption are improving or deteriorating.
    Do not equate one weak auction with a regime change; use trailing comparisons.
- id: V5
  name: AI Productivity Diffusion
  question: Is AI adoption translating into measurable productivity and investment gains outside a narrow group of AI
    suppliers?
  purpose: Provide the principal counterweight to a purely bearish AI thesis by testing whether lower AI costs create
    broad real-economy value.
  metrics:
  - name: Business AI adoption
    definition: Census BTOS percentage of employer businesses reporting current AI use; show total, sector and firm-size
      views where available.
  - name: Expected AI adoption
    definition: BTOS share expecting AI use in the next six months.
  - name: Labor productivity
    definition: BLS nonfarm business labor productivity; show quarterly annualized and year-over-year where available.
  - name: Output per hour
    definition: BLS measure aligned with labor productivity reporting.
  - name: Software / IP investment
    definition: BEA real private fixed investment in software/intellectual property using documented table/line identifiers.
  - name: Information-processing equipment investment
    definition: BEA real investment series where available.
  tickers:
  - SPY
  - RSP
  - XLK
  - XLI
  - IGV
  - IWM
  sources: Census BTOS, BLS productivity data, BEA NIPA/fixed-investment data.
  interpretation_requirement: Explain whether adoption is diffusing beyond large technology firms and whether productivity/investment
    measures are moving in the same direction. Avoid claiming causality from simple co-movement.
- id: V6
  name: Energy
  question: Are power, fuel and grid constraints becoming a binding cost on AI infrastructure and the broader economy?
  purpose: Track the physical infrastructure side of the AI buildout and inflation-sensitive energy shocks separately
    from labor.
  metrics:
  - name: U.S. electricity demand
    definition: Approved EIA hourly/daily demand series aggregated to a documented interval; show YoY comparison.
  - name: Commercial/industrial electricity price
    definition: EIA retail price series, YoY and trailing trend.
  - name: Henry Hub natural gas
    definition: Approved EIA/FRED/market series; document source and frequency.
  - name: Brent and WTI
    definition: Approved market/EIA series; distinguish spot/futures methodology.
  - name: Regional grid load
    definition: PJM/ERCOT or other approved public grid data for major data-center regions when feasible.
  tickers:
  - XLE
  - XLU
  - XOP
  - CEG
  - VST
  sources: EIA and approved public ISO/RTO feeds; approved market-data source for tradeable instruments.
  interpretation_requirement: Explain whether energy demand and prices are raising the marginal cost of AI/data-center
    expansion or creating broader inflation pressure. Treat geopolitical attribution as evidence-based, not assumed.
- id: V7
  name: Labor
  question: Is the labor market absorbing AI-related change while maintaining income and demand, or is weakness emerging
    in exposed sectors?
  purpose: Separate the labor-transition risk from productivity and energy, and track whether AI diffusion is associated
    with healthy adjustment or demand-damaging weakness.
  metrics:
  - name: Unemployment rate
    definition: BLS headline unemployment rate with release/vintage status.
  - name: Nonfarm payroll change
    definition: Monthly payroll change with revisions retained.
  - name: Initial unemployment claims
    definition: Approved Department of Labor/FRED weekly series.
  - name: Job openings
    definition: BLS JOLTS openings level/rate.
  - name: Average weekly hours
    definition: BLS total private / relevant-sector hours.
  - name: Wage growth
    definition: Average hourly earnings YoY and/or ECI, source clearly labeled.
  - name: Sector employment
    definition: Information; Professional and Business Services; data-processing/hosting or other selected AI-exposed
      industries where robust series exist.
  tickers:
  - SPY
  - RSP
  - IWM
  - XLY
  - XLP
  sources: BLS, Department of Labor/FRED, approved market-data source.
  interpretation_requirement: Explain whether labor demand is resilient, cooling, or deteriorating and whether weakness
    is broad or concentrated. Do not attribute sector changes to AI unless supporting evidence exists.
requirements:
- id: FR-001
  name: Seven core variable panels
  description: Dashboard must show V1-V7 as separate panels; Energy and Labor must never be merged.
- id: FR-002
  name: Market tickers inside panels
  description: Each panel must display a curated set of relevant market tickers/instruments adjacent to the underlying
    variable data, with a note that these are market proxies/confirmation rather than causal proof.
- id: FR-003
  name: Calculation transparency
  description: Every derived metric must have a visible "How this is calculated" control showing formula, raw inputs,
    units, source, observation date, retrieval date and revision status.
- id: FR-004
  name: Plain-language interpretation
  description: Every panel must show a 1-3 sentence interpretation that states what changed, why it matters, and what
    would strengthen/weaken the signal.
- id: FR-005
  name: No opaque master score
  description: The product may summarize evidence balance, but must not collapse the seven variables into a single buy/sell
    or risk score.
- id: FR-006
  name: Evidence labels
  description: Every evidence item must be labeled PRIMARY/VERIFIED, SECONDARY/ESTIMATE, or THESIS/CLAIM.
- id: FR-007
  name: Evidence impact
  description: Evidence may be tagged SUPPORTS, COUNTERS, or AMBIGUOUS relative to a clearly named hypothesis; the explanation
    must be stored.
- id: FR-008
  name: Current regime strip
  description: Top of dashboard must show market/macro regime indicators such as S&P 500, Nasdaq, 2Y, 10Y, 2s10s, HY
    spread, USD, Brent, gas and gold. Do not include an "Eisman watch level" or personality-specific threshold marker.
- id: FR-009
  name: Four product pages
  description: 'Navigation: Dashboard; Evidence; About; Definitions & Methodology.'
- id: FR-010
  name: About page
  description: About must explain the origin of the product, the Paulsen and Eisman hypotheses, the combined thesis,
    limitations, and links to the source article/interviews.
- id: FR-011
  name: Definitions & Methodology
  description: Must collect every abbreviation, metric definition, formula, source link, API, update cadence, revision
    policy and known limitation in one auditable page.
- id: FR-012
  name: Source provenance
  description: Every chart/table value must be traceable to a source record; every source record must include source
    URL or endpoint, retrieval timestamp and raw identifier/series/tag when available.
- id: FR-013
  name: Vintage awareness
  description: For revisable macro series, retain original reported values or use vintage/realtime functionality where
    feasible. Backtests must not silently use revised data.
- id: FR-014
  name: Graceful degradation
  description: A failed source must not crash the app; the affected component shows STALE/UNAVAILABLE with last successful
    update and reason.
- id: FR-015
  name: Cost approval gate
  description: No paid API, hosting tier, licensed real-time data or news feed may be enabled without explicit owner
    approval.
- id: FR-016
  name: Private-by-default development
  description: Initial GitHub repository is private; public release is a later explicit decision.
- id: FR-017
  name: Secrets management
  description: API keys are stored in GitHub Actions/Streamlit secrets or environment variables; never committed to source
    control or embedded in downloadable data.
- id: FR-018
  name: Market data labeling
  description: All market prices must state delayed/end-of-day/real-time status and source. The MVP may use delayed/EOD
    data.
- id: FR-019
  name: Interpretation grounding
  description: Interpretations must be generated from deterministic signal rules and observed deltas first; an LLM may
    rewrite for clarity but may not create unsupported conclusions.
- id: FR-020
  name: News copyright hygiene
  description: Store metadata, links, concise summaries and allowed excerpts only; do not replicate full third-party
    articles.
- id: FR-021
  name: Accessibility
  description: Keyboard navigation, readable contrast, alt text for informative images, table headers, and responsive
    layout are required for MVP.
- id: FR-022
  name: Not investment advice
  description: 'Persistent disclosure: research/decision-support tool, not investment advice; no automated trade execution
    in MVP.'
- id: FR-023
  name: Agent handoff without user relay
  description: Work/coordinator and Codex/implementation agents must exchange routine project state through repository
    files, commits/PRs, issues or GitHub artifacts. The owner must not be required to copy/paste prompts, results, test
    output or status between agent chats.
phases:
- phase: '0'
  name: Project setup, approvals and specification freeze
  objective: Create a reproducible private repository, freeze MVP definitions, and establish paid-service approval gates
    before implementation.
  deliverables:
  - Private GitHub repository with branch protection and CODEOWNERS/owner review policy
  - README and this PRD committed as source-of-truth
  - Python environment lockfile/requirements
  - Secrets template with variable names only
  - Decision log for market-data provider, deployment visibility and data retention
  - CI skeleton that runs lint/tests on every pull request
  - 'Repo-resident agent coordination files: docs/phase-status.md, docs/handoffs/current-task.md, and docs/verification/'
  success_criteria:
  - Repository can be cloned and bootstrapped from documented instructions
  - No secret values are present in git history
  - All seven panel definitions and formula IDs are frozen or explicitly marked TBD
  - Any service with potential cost is tagged APPROVAL REQUIRED
  - CI passes on an empty/skeleton application
  - A fresh implementation-agent session with repo access only can identify the active phase, current task, requirement/test
    IDs, latest verification status and open blockers without copied chat context
  tests:
  - id: P0-T01
    name: Fresh-clone bootstrap
    procedure: Clone into a clean environment; install dependencies; run a hello test without manual path edits.
    pass_condition: Pass if setup succeeds from README only.
  - id: P0-T02
    name: Secret scan
    procedure: Run automated secret scanning plus manual check of .env examples.
    pass_condition: Pass if no live key/token is detected.
  - id: P0-T03
    name: Cost gate
    procedure: Search configuration for paid providers/billing toggles.
    pass_condition: Pass if none are enabled and unresolved providers are explicitly TBD.
  - id: P0-T04
    name: Spec integrity
    procedure: Validate machine build spec against schema and compare seven panels to PRD.
    pass_condition: Pass if panel IDs, formulas and page names match.
  - id: P0-T05
    name: Fresh-agent handoff
    procedure: Start a fresh Codex/implementation-agent session with repo access but no prior coordinator chat. Ask it
      to identify the active phase, current task, applicable requirement/test IDs, latest verification result and blockers.
    pass_condition: Pass if all required state is correctly reconstructed from repo/GitHub artifacts without owner copy/paste.
- phase: '1'
  name: UI skeleton and navigation
  objective: Recreate the approved information architecture and dashboard hierarchy using fixture data before connecting
    live sources.
  deliverables:
  - Streamlit app with Dashboard, Evidence, About, Definitions & Methodology pages
  - Current Market & Macro Regime strip
  - Seven separate variable panels with internal ticker rows, chart placeholders, interpretation block and calculation
    disclosure
  - Responsive desktop layout approximating approved mock-up
  - Mock fixture dataset that exercises positive/negative/stale/unavailable states
  success_criteria:
  - All four pages render without error
  - All seven panels are independently visible; Energy and Labor are separate
  - Every panel exposes calculation and interpretation areas
  - No personality-specific threshold marker such as "Eisman watch level" is present
  - App passes basic accessibility and responsive smoke checks
  tests:
  - id: P1-T01
    name: Navigation
    procedure: Open every page from sidebar/top nav and browser refresh.
    pass_condition: No 404/state loss/error.
  - id: P1-T02
    name: Panel inventory
    procedure: Programmatically assert panel IDs V1-V7 occur once each.
    pass_condition: Exactly seven panels; no merged Energy/Labor.
  - id: P1-T03
    name: Ticker proximity
    procedure: Visual test that panel tickers are inside or directly adjacent to their panel.
    pass_condition: Pass if no separate-only ticker page is required to understand the linkage.
  - id: P1-T04
    name: Disclosure controls
    procedure: Expand each "How this is calculated" control.
    pass_condition: All seven controls work and show fixture formula/source metadata.
  - id: P1-T05
    name: Responsive smoke
    procedure: Render common desktop/tablet widths.
    pass_condition: No clipping/overlap; horizontal scrolling only where explicitly intended.
  - id: P1-T06
    name: Stale/unavailable state
    procedure: Inject missing fixture data.
    pass_condition: Panel stays usable and labels the stale/missing state.
- phase: '2'
  name: Provenance, calculations and methodology foundation
  objective: Build the data dictionary and calculation engine before connecting many sources so transparency is structural,
    not bolted on.
  deliverables:
  - Canonical metric registry with IDs, units, formulas, source priority and cadence
  - Source registry and cost/auth metadata
  - Calculation functions with unit tests
  - 'Provenance model: raw input IDs, source URL, observed_at, retrieved_at, vintage/revision state'
  - Definitions & Methodology page generated from the same registry
  - Data-quality flags and lineage display
  success_criteria:
  - 100% of derived metrics used by UI have formula metadata and unit tests
  - Every displayed fixture value can trace to source/input rows
  - Methodology page and code registry cannot drift without CI failure
  - Calculation errors produce explicit invalid/NA state rather than silent coercion
  tests:
  - id: P2-T01
    name: Formula unit tests
    procedure: Test normal, zero, negative and missing inputs for every formula.
    pass_condition: 100% pass; divide-by-zero handled explicitly.
  - id: P2-T02
    name: Lineage round-trip
    procedure: Click/inspect a derived metric and trace back to its raw inputs.
    pass_condition: All inputs and transformations visible.
  - id: P2-T03
    name: Registry drift
    procedure: Modify a formula in code without updating registry hash/snapshot.
    pass_condition: CI must fail.
  - id: P2-T04
    name: Units
    procedure: Feed basis points/percent/fraction variants into validators.
    pass_condition: Incorrect units rejected or normalized with explicit conversion.
  - id: P2-T05
    name: Methodology completeness
    procedure: 'Automated check: every metric shown on Dashboard has definition, formula or "raw metric", source and
      cadence.'
    pass_condition: 100% coverage.
- phase: '3'
  name: Primary public data collectors
  objective: 'Connect robust free/official sources first: Treasury, FRED/ALFRED, SEC, BEA, BLS, Census BTOS and EIA.'
  deliverables:
  - Collector modules with caching/retries and source-specific rate-limit behavior
  - Normalized Parquet tables and DuckDB views
  - Live V3 Rates, V4 Fiscal, most of V5 Productivity, V6 Energy and V7 Labor
  - SEC company facts ingestion for V2 standardized financials
  - Scheduled GitHub Actions jobs by source cadence
  - Last-success and freshness monitoring
  success_criteria:
  - At least 3 historical observations per metric are loaded and chart correctly
  - Sampled values match primary-source pages/APIs within declared tolerance
  - 'Collectors are idempotent: reruns do not duplicate observations'
  - Source failures are isolated and reported
  - No key is logged
  tests:
  - id: P3-T01
    name: Primary-source reconciliation
    procedure: For each source, manually compare at least 5 sampled observations to official published values.
    pass_condition: Exact match or documented rounding tolerance.
  - id: P3-T02
    name: Idempotency
    procedure: Run each collector twice on same window.
    pass_condition: Row counts/keys unchanged on second run.
  - id: P3-T03
    name: Revision handling
    procedure: Simulate revised BLS/FRED value.
    pass_condition: Original/vintage retained where supported and latest view updates correctly.
  - id: P3-T04
    name: Rate-limit/retry
    procedure: Inject 429/5xx/timeouts.
    pass_condition: Backoff occurs; app uses last good data; job reports failure without data corruption.
  - id: P3-T05
    name: SEC tag variance
    procedure: Test at least 3 companies with different XBRL tags/presentation.
    pass_condition: Normalized metrics reconcile or produce review-required flag.
  - id: P3-T06
    name: Freshness
    procedure: Age a dataset beyond SLA.
    pass_condition: UI displays STALE and last-success timestamp.
- phase: '4'
  name: Market data and within-panel confirmation layer
  objective: Add approved delayed/EOD market prices next to each economic variable and the regime strip, while preserving
    licensing/cost clarity.
  deliverables:
  - Approved free/delayed market data collector
  - Ticker/instrument mapping by panel
  - Price, 1D, 1M, YTD and optional relative-to-SPY calculations
  - Regime strip with equities, rates, credit, USD, energy and gold
  - Data-latency labels and market calendar handling
  success_criteria:
  - Every panel shows its approved ticker set and timestamp/status
  - Market data source and delay are visible
  - Weekend/holiday behavior is correct
  - No paid exchange entitlement is assumed
  - Price calculations reconcile to source
  tests:
  - id: P4-T01
    name: Corporate action check
    procedure: Use a split/dividend-adjusted historical case.
    pass_condition: Return calculation uses declared adjusted/unadjusted convention consistently.
  - id: P4-T02
    name: Market closure
    procedure: Load dashboard on weekend/holiday fixture.
    pass_condition: Latest close shown with date; no false "live" label.
  - id: P4-T03
    name: Panel mapping
    procedure: Automated check ticker list against PRD map.
    pass_condition: No ticker appears as a hidden dependency; all have rationale metadata.
  - id: P4-T04
    name: Latency label
    procedure: Switch provider mode between EOD/delayed.
    pass_condition: UI label changes and never claims real-time incorrectly.
  - id: P4-T05
    name: Cost gate
    procedure: Attempt to configure a paid endpoint.
    pass_condition: Deployment blocked unless approval flag is explicitly set by owner.
- phase: '5'
  name: AI Economics & Competition and non-standard capital disclosures
  objective: 'Build the differentiated AI-specific signals: model pricing, usage/model-share proxies and manually curated
    credit/concentration disclosures.'
  deliverables:
  - Provider-price snapshot collector with versioned model catalog
  - Comparable workload price calculations and basket governance
  - Approved token-volume/model-share proxy ingestion
  - Open-weight/proprietary taxonomy with change history
  - Curated filing-disclosure table for guarantees, SPVs/VIEs, lease commitments and customer concentration
  - Prominent proxy/coverage limitations in UI
  success_criteria:
  - Historical price snapshots can be reproduced from stored parsed observations/source metadata
  - No model is silently substituted when discontinued; basket rebalance is versioned
  - Usage proxies are never presented as whole-market totals
  - Secondary concentration estimates are visually distinct from primary filing facts
  - V1 and enhanced V2 show source-specific caveats
  tests:
  - id: P5-T01
    name: Model price snapshot
    procedure: Change a provider price fixture.
    pass_condition: New observation created; prior price remains immutable.
  - id: P5-T02
    name: Basket rebalance
    procedure: Retire one model and add replacement.
    pass_condition: Index history preserves old basket version; new version starts with documented bridge/rebase policy.
  - id: P5-T03
    name: Taxonomy review
    procedure: Test open-weight/proprietary classification edge cases.
    pass_condition: Unknown models require explicit review; no default guess.
  - id: P5-T04
    name: Proxy disclaimer
    procedure: Inspect all usage charts.
    pass_condition: Source sample/coverage warning visible on chart and methodology page.
  - id: P5-T05
    name: Filing evidence
    procedure: For at least 3 non-standard disclosures, compare dashboard value to filing text/table.
    pass_condition: Exact match plus filing URL/section stored.
  - id: P5-T06
    name: Estimate separation
    procedure: Load a secondary analyst estimate alongside filing data.
    pass_condition: Estimate cannot overwrite or average into primary verified value.
- phase: '6'
  name: Deterministic interpretation engine
  objective: Generate concise practical guidance from transparent signal rules before using any LLM rewriting.
  deliverables:
  - Rule registry for deltas, trend windows, freshness and conflicting signals
  - 1-3 sentence interpretation for each panel
  - '"Why this interpretation" disclosure showing triggered rules'
  - Optional LLM paraphrase layer constrained to structured facts
  - Conflict language for mixed signals rather than forced directionality
  success_criteria:
  - Every sentence can be traced to structured observations/rules
  - No interpretation is generated from stale/unavailable data without caveat
  - Same inputs produce deterministic base interpretation
  - LLM-off mode remains fully functional
  - No BUY/SELL or personalized investment recommendation is produced
  tests:
  - id: P6-T01
    name: Golden cases
    procedure: Run predefined bullish/bearish/mixed/stale fixtures for each panel.
    pass_condition: Output matches approved expected meaning.
  - id: P6-T02
    name: Determinism
    procedure: Run same input 100 times with LLM disabled.
    pass_condition: Identical base interpretation.
  - id: P6-T03
    name: Hallucination guard
    procedure: If LLM layer is used, provide only structured facts and test adversarial prompt injection in source text.
    pass_condition: Output contains no facts outside structured context and ignores source instructions.
  - id: P6-T04
    name: Conflict handling
    procedure: Feed price down + volume up, or rates up + curve flattening.
    pass_condition: Interpretation explicitly states mixed evidence rather than averaging to a score.
  - id: P6-T05
    name: Staleness
    procedure: Mark one critical input stale.
    pass_condition: Interpretation includes freshness limitation and lowers confidence.
- phase: '7'
  name: Evidence and news layer
  objective: Create an auditable evidence ledger that links filings, releases and reporting to the seven variables and
    the Paulsen/Eisman/combined hypotheses.
  deliverables:
  - Evidence ingestion from SEC/company IR/government releases and approved public news metadata
  - Evidence categories and source-quality labels
  - SUPPORTS/COUNTERS/AMBIGUOUS classification plus rationale
  - Filters by panel, company, source type, evidence type and date
  - About page source links and thesis descriptions
  - Deduplication and canonical URL handling
  success_criteria:
  - Primary-source items are preferred and clearly distinguishable
  - Every classification has human-readable rationale and named target hypothesis
  - No full copyrighted news articles are stored/reproduced
  - Duplicate stories/releases are grouped
  - About page includes source links to Paulsen and both Eisman interviews
  tests:
  - id: P7-T01
    name: Primary vs secondary
    procedure: Ingest SEC filing and article about same filing.
    pass_condition: Filing marked PRIMARY/VERIFIED; article marked SECONDARY and linked separately.
  - id: P7-T02
    name: Classification rationale
    procedure: Review random sample of 30 evidence items.
    pass_condition: 100% have target hypothesis + rationale; >=90% acceptable on first human review, remainder corrected.
  - id: P7-T03
    name: Copyright
    procedure: Inspect stored payloads.
    pass_condition: No full third-party article body retained; only allowed metadata/summary/excerpt.
  - id: P7-T04
    name: Deduplication
    procedure: Ingest syndicated/duplicate URLs.
    pass_condition: Single evidence cluster with source list.
  - id: P7-T05
    name: Source-link health
    procedure: Automated HEAD/GET where permitted.
    pass_condition: Broken links are flagged, not silently removed.
- phase: '8'
  name: Historical validation, hardening and production deployment
  objective: Prove that the dashboard works with data available at the time, survives failures, and is safe to rely on
    as a research tool.
  deliverables:
  - Vintage-aware historical snapshots/backtests
  - Automated end-to-end suite
  - Visual regression tests for key pages/states
  - 'Observability: pipeline status, freshness, error logs and source health'
  - Backup/export procedure for Parquet/DuckDB data
  - Streamlit Community Cloud deployment connected to private GitHub repo
  - Operations runbook and release checklist
  success_criteria:
  - No P0/P1 defects open
  - 100% formula tests and primary-source reconciliation samples pass
  - Critical-source freshness SLAs met in a 14-day soak period or failures correctly labeled
  - Dashboard can be rebuilt from repo + approved secrets on a clean environment
  - Historical replay does not use future/revised data where vintages are required
  - Owner can export data and methodology without vendor lock-in
  tests:
  - id: P8-T01
    name: Historical replay
    procedure: Choose at least 3 past dates and reconstruct dashboard using then-known data.
    pass_condition: No observation after cutoff timestamp appears.
  - id: P8-T02
    name: Disaster recovery
    procedure: Delete local data cache and rebuild from repo/source pipeline.
    pass_condition: App returns to healthy state with documented steps.
  - id: P8-T03
    name: End-to-end smoke
    procedure: Run full scheduled pipeline then open all pages.
    pass_condition: No broken panel, missing schema or stale label error.
  - id: P8-T04
    name: Visual regression
    procedure: Compare dashboard screenshots to approved baseline at common viewport.
    pass_condition: No unapproved major layout drift.
  - id: P8-T05
    name: Security review
    procedure: Secret scan, dependency audit, permissions review.
    pass_condition: No exposed secret; least-privilege permissions documented.
  - id: P8-T06
    name: 14-day soak
    procedure: Run scheduled jobs for 14 days.
    pass_condition: Target >=99% successful scheduled runs excluding upstream outages; upstream outages handled gracefully.
  - id: P8-T07
    name: Owner acceptance
    procedure: Owner reviews calculation transparency, source links, interpretations and About/Methodology pages.
    pass_condition: Explicit acceptance before declaring MVP complete.
source_policy:
  free_first: true
  paid_service_requires_owner_approval: true
  primary_source_priority: true
  no_full_third_party_article_storage: true
architecture:
  ui: Streamlit
  analytics: DuckDB
  storage_mvp: Parquet + small metadata files in private GitHub repo
  scheduler: GitHub Actions
  hosting_mvp: Streamlit Community Cloud
  migration_path: Object storage/PostgreSQL/VPS if scale requires
  agent_shared_state:
    system_of_record: GitHub repository and GitHub artifacts
    required_files:
    - docs/phase-status.md
    - docs/handoffs/current-task.md
    - docs/verification/<phase>-report.md
    - docs/decision_log.md
    rule: No phase may depend on private chat context or owner-mediated copy/paste between agents.
mvp_done: All Phase 0-8 exit criteria pass and owner explicitly accepts deployed product; P0-T05 fresh-agent handoff
  must pass.
